<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 학습 대시보드</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>HTML 학습 대시보드</h1>

    <div class="calendar-nav" id="calendarNav"></div>
    <div id="content"></div>

    <script>
      async function loadData() {
        try {
          const response = await fetch("JS/html_file_index_cleaned.json");
          const days = await response.json();

          const calendarNav = document.getElementById("calendarNav");
          const contentDiv = document.getElementById("content");

          let rowDiv = null;
          days.forEach((day, index) => {
            if (index % 7 === 0) {
              rowDiv = document.createElement("div");
              rowDiv.className = "calendar-row";
              calendarNav.appendChild(rowDiv);
            }

            const btn = document.createElement("button");
            btn.className = "calendar-button";
            btn.textContent = `${index + 1}일차`;
            btn.onclick = () => toggleSection(day.day);
            rowDiv.appendChild(btn);

            // 날짜별 섹션 생성
            const section = document.createElement("div");
            section.className = "day-section";
            section.id = day.day;
            section.innerHTML = `<h3>${day.title}</h3>`;

            const table = document.createElement("table");
            table.innerHTML = `
              <thead>
                <tr>
                  <th>번호</th>
                  <th>유형</th>
                  <th>파일명</th>
                  <th>링크</th>
                </tr>
              </thead>
              <tbody>
                ${day.files
                  .map(
                    (file, i) => `
                  <tr>
                    <td>${i + 1}</td>
                    <td>${file.type}</td>
                    <td>${file.name}</td>
                    <td><a href="${file.path}" target="_blank">보기</a></td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            `;

            section.appendChild(table);
            contentDiv.appendChild(section);
          });
        } catch (error) {
          console.error("데이터 로딩 오류:", error);
        }
      }

      function toggleSection(id) {
        document.querySelectorAll(".day-section").forEach((sec) => {
          sec.style.display = "none";
        });
        const target = document.getElementById(id);
        if (target) target.style.display = "block";
      }

      loadData();
    </script>
  </body>
</html>
