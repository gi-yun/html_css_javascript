<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      // 타이머 응용 재귀함수 사용
      let num = 0;
      const fn1 = () =>
        setTimeout(() => {
          document.body.innerHTML += `${++num}회 반복중...<br>`;
          fn1(); // 재귀함수
        }, 1000);
      fn1(); //무한반복
    </script>
</body>
</html>
