<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<script>
      function pt(name = "없어") {
        console.log(name + "안녕??");
      }
      setTimeout(function () {
        pt("홍길동");
      }, 1000);
      setTimeout(() => pt("홍"), 2000);
      setTimeout(pt, 3000);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<h1>저는 곧 변합니다.</h1>
<script>
      /* 방식1 */
      const cg = () => {
        const h1 = document.querySelector("h1");
        h1.textContent = "변했어요!";
      };
      setTimeout(cg, 2000);
      /* 방식2 */
      //   setTimeout(() => document.querySelector("h1").textContent = "변했어요!" , 4000);

      /* 방식3 - 인자넣기 */
      const cc = (text) => {
        const h1 = document.querySelector("h1");
        h1.textContent = text;
      };
      setTimeout(() => cc("우와!!!"), 4000);
      setTimeout(() => cc("드디어~"), 5000);
      setTimeout(() => cc("변했다."), 6000);
      // 방식 4 - 인자넣기
      setTimeout(cc, 7000, "ㅋㅋㅋㅋ");
      setTimeout(cc, 8000, "또");
      setTimeout(cc, 9000, "변할까");
    </script>
</body>
</html>
