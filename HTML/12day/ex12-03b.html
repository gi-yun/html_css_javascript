<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>입력받기</title>
<script>
      // 변수를 선언
      let number = 10;

      // 출력합니다.
      alert(number);
      number += 1;
      alert(number);
      number += 1;
      alert(number);
      number += 1;

      //변수 선언
      let number1 = 10;
      alert(++number1);
      alert(++number1);
      alert(++number1);

      //변수 선언
      let number2 = 10;
      alert(number2++);
      alert(++number2);
      alert(number2--);
      alert(++number2);

      //변수 선언
      let number3 = 10;

      alert("number3 : " + number3);
      number3++;
      number3++;
      alert(number3);
      alert(number3);
      number3--;
      number3--;
      alert(number3);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
