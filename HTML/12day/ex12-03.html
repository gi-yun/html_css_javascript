<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>입력받기</title>
<script>
      let input = prompt(`값을 입력하세요`);
      num = input;
      console.log(`후위연산자`);
      console.log(`num 값이 ${num}일때.`);
      console.log(`num++일때 ${num++}`);
      console.log(`num++일때 ${num++}`);
      console.log(`num++일때 ${num++}`);
      console.log(`num일때 ${num}`);
      console.log(`====================`);
      num = input;
      console.log(`전위위연산자`);
      console.log(`num 값이 ${num}일때.`);
      console.log(`++num일때 ${++num}`);
      console.log(`++num일때 ${++num}`);
      console.log(`++num일때 ${++num}`);
      console.log(`====================`);
      num = input;
      console.log(`연속한 예`);
      console.log(`num 값이 ${num}일때.`);
      console.log(`num++일때 ${num++}`);
      console.log(`++num일때 ${++num}`);
      console.log(`num--일때 ${num--}`);
      console.log(`--num일때 ${--num}`);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
