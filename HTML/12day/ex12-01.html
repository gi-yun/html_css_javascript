<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>입력받기</title>
<script>
      const name = prompt("당신은 누구인가요?");
      console.log(name + "님 안녕하세요.");
      alert(`${name}님 안녕하세요.`);
      name !== "관리자" ||
        document.write(`<h2> 위대한 관리자님! 어서오세요!</h2>`);
      name == "관리자" ||
        document.write(`<h2>${name}님 께서 입장하셨습니다.</h2>`);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
