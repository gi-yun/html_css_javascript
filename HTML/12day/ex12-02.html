<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>입력받기</title>
<script>
      const inp = prompt("숫자르 적어주세요", 1);
      if (inp > 3) {
        console.log("3보다 큽니다.");
      } else if (inp == 3) {
        console.log("3과 같습니다");
      } else {
        console.log("3보다 작습니다.");
      }
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
