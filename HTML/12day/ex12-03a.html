<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>입력받기</title>
<script>
      let x = 5;
      let y = 5;

      console.log("초기값 x:", x);
      console.log("초기값 y:", y);

      // 전위 연산자
      let result1 = ++x;
      console.log("전위연산(++x)", result1);
      console.log("전위후 x", x);

      //전위연산자
      let result2 = y++;
      console.log("전위연산(y++)", result2);
      console.log("전위후 y", y);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
