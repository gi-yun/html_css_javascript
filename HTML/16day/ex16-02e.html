<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      // 일반 함수 표현식
      const add = function (a, b) {
        return a + b;
      };
      console.log(add(20, 7));
      console.log(typeof add);

      // 즉시 실행 함수
      const add2 = (function (a, b) {
        return a + b;
      })(21, 7);
      add();
      console.log(add2);
      console.log(typeof add2);

      // 즉시 실행 함수 test
      (function () {
        console.log("과자는 즉시 드세요.");
      })();
    </script>
</body>
</html>
