<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<link href="reset.css" rel="stylesheet"/>
<style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #container {
        width: 920px;
        display: flex;
        border: 4px solid black;
        border-radius: 30px;
        flex-direction: row-reverse;
        background-color: beige;
      }
      #container > div {
        width: 200px;
        height: 200px;
        background-color: cornflowerblue;
        margin: 20px;
        border-radius: 50%;
        font-size: 3rem;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #container > div:nth-of-type(1) {
        background-color: rgb(83, 137, 1);
      }
      #container > div:nth-of-type(2) {
        background-color: rgb(242, 255, 0);
      }
      #container > div:nth-of-type(3) {
        background-color: rgb(255, 5, 5);
      }
    </style>
</head>
<body>
<h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<div id="container">
<div></div>
<div></div>
<div></div>
<div>⬅</div>
</div>
</body>
</html>
