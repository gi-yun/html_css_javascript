<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<script>
      document.addEventListener("DOMContentLoaded", () => {
        const h1 = document.createElement("h1");
        const div = document.createElement("div");
        h1.textContent = "키보드 이벤트 감지 중...";
        div.classList.add("event-log");
        document.body.appendChild(h1);
        document.body.appendChild(div);

        const printKey = () => {
          let list = "";
          list += `
              <b>이벤트타입</b>${event.type}<br>
              <b>Key:</b>${event.key}<br />
              <b>Code:</b>${event.code}<br />
              <b>AltKey:</b>${event.altKey}<br />
              <b>CtrlKey:</b>${event.ctrlKey}<br />
              <b>ShiftKey:</b>${event.shiftKey}<br />
              <b>keyCode(old):</b>${event.keyCode}<br />
          `;
          div.innerHTML = list;
        };
        document.addEventListener("keyup", printKey);
      });
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<b>이벤트타입</b>
<b>Key:</b><br/>
<b>Code:</b><br/>
<b>AltKey:</b><br/>
<b>CtrlKey:</b><br/>
<b>ShiftKey:</b><br/>
</body>
</html>
