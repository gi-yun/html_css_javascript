<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<!-- h1#count{글자수:0} -->
<h1 id="count">글자수 : 0</h1>
<textarea cols="20" maxlength="200" name="" onkeyup="updateText()" rows="10"></textarea>
<script>
      function updateText() {
        const textArea = document.querySelector("textarea");
        const count = document.querySelector("#count");
        count.textContent = `글자수 : ${textArea.value.length}`;
      }
    </script>
</body>
</html>
