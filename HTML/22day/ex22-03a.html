<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<style>
      body {
        margin: 0;
        padding: 0;
        height: 390vh;
      }
      section {
        height: 95vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        color: burlywood;
        background-color: beige;
      }
      section:nth-of-type(even) {
        background-color: rgb(220, 232, 247);
        color: cadetblue;
      }
      .scroll-text {
        position: fixed;
        top: 250px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.6rem;
        font-weight: bold;
        box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.413);
        padding: 10px;
        border-radius: 20px;
      }
      .left-menu {
        width: 150px;
        height: 250px;
        background-color: cadetblue;
        color: white;
        padding: 20px;
        position: fixed;
        top: 100px;
        border-radius: 10px;
        left: -200px;
        opacity: 0;
        transition: 0.5s ease;
      }
      .show-left {
        left: 20px;
        opacity: 1;
      }
      .right-menu {
        width: 70px;
        height: 100px;
        background-color: violet;
        color: white;
        padding: 20px;
        position: fixed;
        top: 100px;
        border-radius: 10px;
        right: -200px;
        opacity: 0;
        transition: 0.5s ease;
      }
      .show-right {
        right: 20px;
        opacity: 1;
      }
    </style>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<!-- div.scroll-text#scrollText{처음이에요. 스크롤을 내려보세요.} -->
<div class="scroll-text" id="scrollText">
      처음이에요. 스크롤을 내려보세요.
    </div>
<!-- div.left-menu#leftMenu{왼쪽메뉴} -->
<div class="left-menu" id="leftMenu">왼쪽메뉴</div>
<div class="right-menu" id="rightMenu">오른쪽 <br/>메뉴</div>
<!-- section{$단계}*5 -->
<section>1단계</section>
<section>2단계</section>
<section>3단계</section>
<section>4단계</section>
<section>End</section>
<script>
      const scollText = document.getElementById("scrollText");
      const leftMenu = document.getElementById("leftMenu");
      const rightMenu = document.getElementById("rightMenu");

      window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;
        console.log(scrollY);
        /* 스크롤 위치에 따른 텍스트를 변경 */
        if (scrollY < 900) {
          scollText.textContent = "아래로 스크롤을 내려보세요.";
        } else if (scrollY < 1700) {
          scollText.textContent = "지금은 2단계 입니다.";
        } else if (scrollY < 2500) {
          scollText.textContent = "지금은 3단계 입니다.";
        } else if (scrollY < 3200) {
          scollText.textContent = "지금은 4단계 입니다.";
        } else if (scrollY < 3700) {
          scollText.textContent = "마지막 구간이에요.";
        }

        if (scrollY < 800 && scrollY < 1800) {
          leftMenu.classList.add("show-left");
        } else {
          leftMenu.classList.remove("show-left");
        }
        if (scrollY >= 1500 && scrollY < 2300) {
          rightMenu.classList.add("show-right");
        } else {
          rightMenu.classList.remove("show-right");
        }
      });
    </script>
</body>
</html>
