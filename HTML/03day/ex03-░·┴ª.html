<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<body>
<h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<fieldset>
<h1>프런트 엔드 개발자 지원서</h1>
<form action="">
<p>
          HTML, CSS, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을
          찾습니다.
        </p>
<hr/>
<h3>개인정보</h3>
<label for="name">이름</label>
<input id="name" placeholder="공백 없이 입력하세요" type="text"/><br/>
<label for="phone">연락처</label>
<input id="phone" pattern="[0-9]{11}" type="tel"/><br/>
<h3>지원분야</h3>
<input id="field_publishing" name="field" type="radio" value="publishing"/>
<label for="field_publishing">웹 퍼블리싱</label><br/>
<input id="field_development" name="field" type="radio" value="development"/>
<label for="field_development">웹 어플리케이션 개발</label><br/>
<input id="field_improvement" name="field" type="radio" value="improvement"/>
<label for="field_improvement">개발 환경 개선</label> <br/>
<h3>지원동기</h3>
<label for="motive"></label>
<textarea cols="60" id="text-area" name="motive" placeholder="본사 지원 동기를 간략히 써 주세요" rows="5" style="resize: none"></textarea><br/>
<input type="submit" value="접수하기"/>
<input type="reset" value="다시쓰기"/>
</form>
</fieldset>
</body>
</html>
