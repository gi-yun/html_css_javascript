<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>가상요소선택자</title>
<style>
      p:first-child {
        color: blue;
      }
      p:first-child::after {
        content: " 유성";
        color: green;
      }
      p:before {
        content: "🦋";
      }
      p:nth-child(2) {
        color: brown;
        background-color: yellow;
        display: inline;
      }
      p:nth-last-of-type(3)::after {
        content: "🦋";
        font-size: 0.5rem;
      }
      p:nth-last-of-type(2) {
        content: "🦋";
        color: chartreuse;
      }
      p:last-of-type::after {
        content: " 감사합니다!!";
        background-color: rgb(54, 41, 41);
        color: white;
      }
    </style>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<p>나의사랑</p>
<p>나의가족</p>
<p>행복미래</p>
<p>올 때</p>
<p>이제 끝</p>
</body>
</html>
