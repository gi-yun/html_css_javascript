<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>while 반복문</title>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      num = 0;
      while (num < 10) {
        console.log(num, "제가 몇번 반복되나요?");
        num += 1;
        if (num == 10) {
          break;
        }
      }
    </script>
</body>
</html>
