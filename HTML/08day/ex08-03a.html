<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<style>
    div {
      width: 200px;
      height: 200px;
      background-color: cadetblue;
      margin: 10px;
      position: relative;
      transition: all 1s ease;
    }
    div:nth-of-type(2) {
      background-color: brown;
      position: absolute;
      top: 100px;
      left: 100px;
    }
    div:first-of-type:hover {
      z-index: 10;
    }
    div:nth-of-type(2):hover {
      opacity: 0.5;
    }
  </style>
<body>
<h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<div></div>
<div></div>
</body>
</html>
