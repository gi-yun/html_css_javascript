<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      let num = 0;
      const arr = Array(100)
        .fill(0)
        .map((v, i, a) => {
          num += 1;
          if (num % 15 == 0) {
            return "아싸";
          }

          if (num % 5 == 0) {
            return "오~";
          }
          if (num % 3 == 0) {
            return "짝!";
          }

          return num;
        });
      console.log(arr);
    </script>
