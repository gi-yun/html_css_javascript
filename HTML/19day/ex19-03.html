<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<script>
      /* 1부터 100까지 1씩 증가하는 배열을 만들어라 */
      const arr = Array(100)
        .fill(0)
        .map((v, i) => i + 1);
      console.log(arr);

      /* 그중에서 홀수만 배열로 뽑아내라 */
      const ft = (v) => v % 3 === 0;
      const odd = arr.filter(ft);
      console.log(odd);
    </script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3></body>
</html>
