<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      const date = dayjs();
      console.log(date);
      const list = `<h1>
      ${date}<br>
      ${date.format()}<br>
      ${date.format("YYYY/MM/DD")}<br>
      ${date.format("YYYY년 MM일 DD일 / HH시 mm분 ss초")}<br>
      ${date.get("ms")}<br>
        </h1>`;
      document.body.innerHTML = list;
    </script>
</body>
</html>
