<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>타노스사이트트</title>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<style></style>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      const now = dayjs();
      const random = now.get("ms") % 2;
      console.log(random);
      if (random == 0) {
        document.body.innerHTML = `<h1>당신은 타노스에게 우주를 위해 희생 되었습니다.</h1>`;
      } else {
        document.body.innerHTML = `<h1>당신은 타노스가 살려줬습니다.</h1>`;
      }
    </script>
</body>
</html>
