<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
</head>
<body><h3><a href="../../index.html">홈으로 돌아가기</a></h3>
<script>
      let list = "";
      list += "<table border='1'>";
      for (let i = 0; i < 10; i++) {
        console.log(i);
        list += "<tr>";

        list += `<th>${i}단</th>`;
        list += "</tr>";
        for (let j = 1; j < 9; j++) {
          console.log(j);
          list += "<tr>";
          list += `<td>${i}x${j} = ${i * j}입니다.</td>`;
          list += "</tr>";
        }
      }
      document.body.innerHTML += list;
      list += "</table>";
    </script>
</body>
</html>
